# SatQuery AI — Phase 1 orchestration (SIH26167).
# Multi-container layout is ready: backend is the sovereign FastAPI/GDAL runtime.
# Database and inference services are stubbed as comments for later phases.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satquery-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      SATQUERY_ENV: ${SATQUERY_ENV:-development}
      PYTHONPATH: /app
      LOCAL_MODELS_DIR: /local_models
      DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # DATABASE_URL is owned by the database teammate. Uncomment with the db service.
      # DATABASE_URL: postgresql://${POSTGRES_USER:-satquery}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-satquery}
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./local_models:/local_models:ro
      - ./models:/app/models
    # GPU hosts: uncomment the block below (requires NVIDIA Container Toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 8
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # db — PostGIS / PostgreSQL (placeholder for database architecture teammate)
  # Plug in image, credentials, init scripts, and healthcheck here.
  # When ready, add `depends_on: db` to the backend service.
  #
  # db:
  #   image: postgis/postgis:16-3.4
  #   container_name: satquery-db
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-satquery}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB:-satquery}
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     - postgis_data:/var/lib/postgresql/data
  #     # - ./db/init-postgis.sh:/docker-entrypoint-initdb.d/01-init-postgis.sh:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satquery} -d ${POSTGRES_DB:-satquery}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #   restart: unless-stopped
  # -------------------------------------------------------------------------

  # Optional analyst UI (unchanged Phase 0 frontend). Not required for air-gap health.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: satquery-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    profiles: ["ui"]

