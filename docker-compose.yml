version: "3.8"

# SatQuery AI — Phase 1: local air-gapped orchestration.
# db: PostgreSQL 16 + PostGIS 3.4 (spatial GIS volume)
# backend: FastAPI on NVIDIA GPU, offline weight cache
# frontend: React compiled in-image, served on :3000

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: satquery_db
    environment:
      - POSTGRES_USER=satquery_admin
      - POSTGRES_PASSWORD=isro_secure_db
      - POSTGRES_DB=satquery_gis
    ports:
      - "5432:5432"
    volumes:
      - satquery_db_data:/var/lib/postgresql/data
      - ./db/init-postgis.sh:/docker-entrypoint-initdb.d/01-init-postgis.sh
      - ./backend/app/database/init_db.sql:/docker-entrypoint-initdb.d/02-init_db.sql
    networks:
      - satquery_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery_admin -d satquery_gis"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satquery_backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./local_models:/app/models
      - ./local_models:/local_models:ro
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://satquery_admin:isro_secure_db@db:5432/satquery_gis
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOCAL_MODELS_DIR=/local_models
      - PYTHONPATH=/app
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - satquery_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 8
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: satquery_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - satquery_network
    restart: unless-stopped

volumes:
  satquery_db_data:

networks:
  satquery_network:
    driver: bridge
